name: Publish library

on:
  push:
    tags:
      - 'ai-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test library
        run: pnpm exec nx test duxkit-ai -- --watch=false

      - name: Build library
        run: pnpm build:lib

      - name: Check release version
        run: node scripts/check-release-version.mjs projects/duxkit-ai/package.json ai-v

      - name: Check package entrypoints
        run: pnpm check:package-entrypoints

      - name: Verify package contents
        working-directory: dist/duxkit-ai
        run: npm pack --dry-run

      - name: Publish package
        working-directory: dist/duxkit-ai
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
